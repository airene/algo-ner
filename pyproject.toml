[project]
name = "rag-ner"
version = "0.1.0"
description = "Local RaNER HTTP service for macOS Apple Silicon and NVIDIA CUDA"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "addict==2.4.0",
  "fastapi==0.141.1",
  "modelscope[framework]==1.37.1",
  "numpy>=1.26,<3",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.2.2",
  "transformers>=4.45,<6",
  "uvicorn[standard]==0.52.0",
]

[project.optional-dependencies]
ml = [
  "torch==2.9.1; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
  "torch==2.13.0+cu129; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
]
dev = [
  "httpx==0.28.1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ner"]

# These are the only supported deployment targets.
[tool.uv]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64' and implementation_name == 'cpython' and python_version == '3.13'",
  "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython' and python_version == '3.13'",
]
find-links = ["https://mirrors.aliyun.com/pytorch-wheels/cu129/"]

[[tool.uv.index]]
name = "ustc"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
